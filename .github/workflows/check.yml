name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the scripts
        run: npm test
      - name: Check registrations and yanks
        run: node scripts/check-pull-request.mjs "${{ github.event.pull_request.base.sha }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

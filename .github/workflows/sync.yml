name: Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The sync reads manifests and checks releases with the latest compiler release, compiler/<version>.
      - name: Download the latest compiler
        run: |
          tag="$(gh api 'repos/nanyx-lang/nanyx/releases?per_page=100' \
            --jq '[.[] | select((.draft or .prerelease) | not) | select(.tag_name | startswith("compiler/"))][0].tag_name // ""')"
          if [ -z "$tag" ]; then
            echo "::error::nanyx-lang/nanyx has no compiler/<version> release"
            exit 1
          fi
          version="${tag#compiler/}"
          gh release download "$tag" --repo nanyx-lang/nanyx --pattern "nanyx-$version-linux-x64.tar.gz" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/nanyx"
          tar -xzf "$RUNNER_TEMP/nanyx-$version-linux-x64.tar.gz" -C "$RUNNER_TEMP/nanyx"
          echo "Using the Nanyx compiler $version, from the release $tag"
          echo "NANYX=$RUNNER_TEMP/nanyx/nanyx" >> "$GITHUB_ENV"
          echo "NANYX_VERSION=$version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read releases
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit index changes
        id: commit
        run: |
          mkdir -p index
          git add index
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync package versions"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Package pages read each repository's description from GitHub's API, and its README.
      - name: Build the site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: sync
    # Hourly runs that change nothing don't redeploy.
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
